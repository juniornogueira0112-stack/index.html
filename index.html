<<!DOCTYPE html>
<html>
<head>
  <title>Pedido</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body { 
      font-family: Arial; 
      padding: 15px; 
      background: #f5f5f5; 
    }

    h2 { 
      text-align: center; 
      margin-bottom: 20px;
    }

    input, textarea { 
      padding: 10px; 
      font-size: 16px; 
      box-sizing: border-box; 
      border-radius: 6px;
      border: 1px solid #ccc;
      width: 100%;
    }

    .linha { 
      display: flex; 
      gap: 10px; 
      margin-bottom: 10px; 
      flex-wrap: wrap; 
    }

    .linha .campo { 
      flex: 1; 
      min-width: 140px;
    }

    /* PRODUTOS */
    .produto { 
      background: white; 
      padding: 12px; 
      margin-bottom: 12px; 
      border-radius: 10px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .produto-topo {
      margin-bottom: 8px;
    }

    .produto-topo b {
      font-size: 14px;
    }

    .produto-topo label {
      font-size: 12px;
      display: block;
      margin-top: 4px;
    }

    .produto-topo input[type="number"] {
      width: 120px;
      margin-top: 6px;
    }

    .direita { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      margin-top: 10px; 
    }

    .qtd { 
      width: 70px; 
      text-align: center;
    }

    .valorItem { 
      flex: 1;
      font-weight: bold; 
      color: green; 
      text-align: right;
      font-size: 16px;
    }

    .total { 
      font-size: 22px; 
      font-weight: bold; 
      text-align: center; 
      margin-top: 20px; 
    }

    button { 
      width: 100%; 
      padding: 15px; 
      background: green; 
      color: white; 
      font-size: 18px; 
      border: none; 
      border-radius: 10px; 
      margin-top: 10px;
    }

    textarea { 
      resize: vertical; 
      min-height: 60px; 
      margin-top: 6px; 
    }

    /* MOBILE AJUSTE FINO */
    @media (max-width: 600px) {
      .linha {
        flex-direction: column;
      }

      .direita {
        justify-content: space-between;
      }

      .valorItem {
        font-size: 18px;
      }

      button {
        font-size: 16px;
      }
    }

  </style>
</head>

<body>

<h2>Pedido</h2>

<div class="linha">
  <input class="campo" id="cliente" placeholder="Nome/Razão Social do Cliente">
  <input class="campo" id="doc" placeholder="CPF/CNPJ" oninput="formatarDocumento(this)">
</div>

<div class="linha">
  <input class="campo" id="vendedor" placeholder="Nome do vendedor">
  <input class="campo" id="cidade" placeholder="Cidade">
</div>

<div class="linha">
  <input class="campo" id="data" type="date" placeholder="Data do Pedido">
  <input class="campo" id="pagamento" placeholder="Forma de Pagamento">
</div>

<h3>Produtos</h3>
<div id="produtos"></div>

<textarea id="observacoes" placeholder="Observações gerais (opcional)"></textarea>

<div class="total">
  Total: <span id="total">R$ 0,00</span>
</div>

<button onclick="enviarPedido()">FINALIZAR PEDIDO</button>
<button onclick="limparPedido()" style="background:#888;">
  LIMPAR PEDIDO
</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

<script>

const listaProdutos = [
  { codigo: "85", nome: "Vela 5F CX 24x8 (7898269580370)", preco: 2.99 },
  { codigo: "03", nome: "Vela N3 24x8 (7898269580011)", preco: 4.99 },
  { codigo: "05", nome: "Vela N5 24x8 (7898269580028)", preco: 6.42 },
  { codigo: "08", nome: "Vela N8 24x8 (7898269580035)", preco: 8.25 },
  { codigo: "07", nome: "Vela Votiva Fina 24x1 (7898269580042)", preco: 9.95 },
  { codigo: "17", nome: "Vela Votiva Fina Imagem 24x1 (7898269580448)", preco: 9.95 },
  { codigo: "04", nome: "Vela N4 24x8 (7898269580059)", preco: 7.20 },
  { codigo: "06", nome: "Vela N6 24x8 (7898269580066)", preco: 8.25 },
  { codigo: "09", nome: "Vela N9 24x8 (7898269580073)", preco: 10.07 },
  { codigo: "10", nome: "Vela N10 24x6 (7898269580103)", preco: 13.06 },
  { codigo: "12", nome: "Vela N12 24x6 (7898269580097)", preco: 15.03 },
  { codigo: "27", nome: "Vela 7 Dias Grossa 24x1 (7898269580080)", preco: 12.42 },
  { codigo: "37", nome: "Vela 7 Dias Grossa Imagem 24x1 (7898269580196)", preco: 12.42 },
  { codigo: "15", nome: "Vela N5 Colorida 24x8", preco: 6.42 },
  { codigo: "67", nome: "Vela Votiva Fina Colorida 24x1", preco: 9.95 },
  { codigo: "55", nome: "Vela N5 Bicolor 24x8", preco: 7.55 },
  { codigo: "68", nome: "Vela Votiva Fina Bicolor 24x1", preco: 11.67 },
  { codigo: "77", nome: "Vela Votiva Fina 7 Linhas 24x1", preco: 14.10 },
  { codigo: "60", nome: "Vela Votiva Fina Mel 24x1 (7898269580226)", preco: 11.68 },
  { codigo: "80", nome: "Vela Citronela 24x1 (7898269580318)", preco: 8.25 },
  { codigo: "90", nome: "Velas por Quilo Branca ou Colorida", preco: 34.60 }
];

const produtosComCampoExtra = ["17","37","15","55","67","68","90"];

function formatarDocumento(campo) {
  let valor = campo.value.replace(/\D/g, '');
  if (valor.length <= 11) { 
    valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
    valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
    valor = valor.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
  } else { 
    valor = valor.replace(/^(\d{2})(\d)/, '$1.$2');
    valor = valor.replace(/^(\d{2}\.\d{3})(\d)/, '$1.$2');
    valor = valor.replace(/^(\d{2}\.\d{3}\.\d{3})(\d)/, '$1/$2');
    valor = valor.replace(/(\d{4})(\d{1,2})$/, '$1-$2');
  }
  campo.value = valor;
}

function formatarMoeda(valor) {
  return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function togglePreco(i) {
  const campo = document.getElementById(`preco_${i}`);
  campo.disabled = !campo.disabled;
}
function limparPedido() {
  if (!confirm("Tem certeza que deseja limpar o pedido?")) return;

  // Campos principais
  document.getElementById("cliente").value = "";
  document.getElementById("doc").value = "";
  document.getElementById("vendedor").value = "";
  document.getElementById("cidade").value = "";
  document.getElementById("data").value = "";
  document.getElementById("pagamento").value = "";
  document.getElementById("observacoes").value = "";

  // Produtos
  listaProdutos.forEach((p, i) => {
    // Zera quantidade
    document.getElementById(`qtd_${i}`).value = 0;

    // Zera valor do item
    document.getElementById(`valor_${i}`).innerText = "R$ 0,00";

    // Restaura o preço original
    const campoPreco = document.getElementById(`preco_${i}`);
    campoPreco.value = p.preco;
    campoPreco.disabled = true;

    // Desmarca "Alterar preço"
    const checkbox = campoPreco.closest(".produto").querySelector('input[type="checkbox"]');
    if (checkbox) checkbox.checked = false;

    // Limpa informações adicionais
    const campoObs = document.getElementById(`obs_${i}`);
    if (campoObs) campoObs.value = "";
  });

  // Total
  document.getElementById("total").innerText = "R$ 0,00";
}
function renderProdutos() {
  const div = document.getElementById("produtos");
  div.innerHTML = "";
  listaProdutos.forEach((p, i) => {
    const campoExtra = produtosComCampoExtra.includes(p.codigo)
      ? `<textarea placeholder="Informações adicionais" id="obs_${i}"></textarea>`
      : "";
    div.innerHTML += `
      <div class="produto">
        <div>
  <b>${p.codigo}</b> - ${p.nome}<br>

  <label style="font-size:12px;">
    <input type="checkbox" onchange="togglePreco(${i})"> Alterar preço
  </label><br>

 <div style="display:flex; align-items:center; background:#f1f1f1; padding:5px 8px; border-radius:6px; width:120px; margin-top:4px;">
  <span style="font-size:14px;">R$</span>
  <input 
    type="number" 
    id="preco_${i}" 
    value="${p.preco}" 
    step="0.01"
    disabled
    style="border:none; background:transparent; width:100%;"
    onchange="calcularTotal()"
  >
</div>

  ${campoExtra}
</div>
        <div class="direita">
          <input class="qtd" type="number" min="0" value="0" onchange="calcularTotal()" id="qtd_${i}">
          <span class="valorItem" id="valor_${i}">R$ 0,00</span>
        </div>
      </div>
    `;
  });
}

function calcularTotal() {
  let total = 0;
  listaProdutos.forEach((p, i) => {
    const qtd = Number(document.getElementById(`qtd_${i}`).value);
    const preco = Number(document.getElementById(`preco_${i}`).value);
    const totalItem = qtd * preco;
    document.getElementById(`valor_${i}`).innerText = formatarMoeda(totalItem);
    total += totalItem;
  });
  document.getElementById("total").innerText = formatarMoeda(total);
}

function preencherDataHoje() {
  const hoje = new Date();

  const ano = hoje.getFullYear();
  const mes = String(hoje.getMonth() + 1).padStart(2, '0');
  const dia = String(hoje.getDate()).padStart(2, '0');

  // Formato que o input date entende (YYYY-MM-DD)
  const dataFormatada = `${ano}-${mes}-${dia}`;

  document.getElementById("data").value = dataFormatada;
}
  
  function gerarPDF(pedido){

  const { jsPDF } = window.jspdf;

  const doc = new jsPDF({
    orientation:"portrait",
    unit:"mm",
    format:"a4"
  });

  const margem = 10;
  const largura = 190;

  // CORES DA IDENTIDADE
  const MARROM = [111, 67, 37];
  const MARROM_ESCURO = [79, 47, 27];
  const CREME = [244, 239, 232];
  const BORDA = [216, 203, 189];

  // ============================
  // CABEÇALHO
  // ============================

  doc.addImage(
    logo,
    "PNG",
    margem,
    10,
    58,
    48
  );

  doc.setDrawColor(...MARROM);
  doc.setLineWidth(0.5);

  doc.line(
    125,
    10,
    125,
    53
  );

  doc.setTextColor(...MARROM_ESCURO);

  doc.setFont("helvetica","normal");
  doc.setFontSize(10);

  doc.text(
    "PEDIDO Nº",
    140,
    19
  );

  doc.setFont("helvetica","bold");
  doc.setFontSize(23);

  doc.text(
    pedido.numero,
    140,
    29
  );

  doc.setFont("helvetica","normal");
  doc.setFontSize(10);

  doc.text(
    "DATA DO PEDIDO",
    140,
    40
  );

  doc.setFont("helvetica","bold");
  doc.setFontSize(12);

  doc.text(
    dataBR(pedido.data),
    140,
    47
  );


  // ============================
  // DADOS DO CLIENTE
  // ============================

  let y = 62;

  doc.setFillColor(...CREME);

  doc.roundedRect(
    margem,
    y,
    largura,
    8,
    1,
    1,
    "F"
  );

  doc.setTextColor(...MARROM_ESCURO);
  doc.setFont("helvetica","bold");
  doc.setFontSize(11);

  doc.text(
    "DADOS DO CLIENTE",
    15,
    y + 5.5
  );

  y += 15;

  doc.setDrawColor(...BORDA);
  doc.setLineWidth(0.3);

  doc.roundedRect(
    margem,
    y,
    largura,
    35,
    1,
    1,
    "S"
  );

  doc.setFont("helvetica","normal");
  doc.setFontSize(9);
  doc.setTextColor(90,80,72);

  doc.text("Cliente:",15,y+8);
  doc.text("CPF/CNPJ:",110,y+8);

  doc.text("Cidade:",15,y+19);
  doc.text("Vendedor:",15,y+30);

  doc.text(
    "Forma de Pagamento:",
    110,
    y+19
  );

  doc.setFont("helvetica","bold");
  doc.setFontSize(10);
  doc.setTextColor(...MARROM_ESCURO);

  doc.text(
    pedido.cliente || "-",
    15,
    y+13
  );

  doc.text(
    pedido.doc || "-",
    110,
    y+13
  );

  doc.text(
    pedido.cidade || "-",
    15,
    y+24
  );

  doc.text(
    pedido.vendedor || "-",
    15,
    y+35
  );

  doc.text(
    pedido.pagamento || "-",
    110,
    y+24
  );


  // ============================
  // ITENS DO PEDIDO
  // ============================

  y += 43;

  doc.setFillColor(...CREME);

  doc.roundedRect(
    margem,
    y,
    largura,
    8,
    1,
    1,
    "F"
  );

  doc.setTextColor(...MARROM_ESCURO);
  doc.setFont("helvetica","bold");
  doc.setFontSize(11);

  doc.text(
    "ITENS DO PEDIDO",
    15,
    y + 5.5
  );

  y += 10;

  const tabela = [];

  pedido.itens.forEach(item => {

    tabela.push([
      item.codigo || "",
      item.nome || "",
      String(item.qtd),
      formatarMoeda(item.preco),
      formatarMoeda(
        item.preco * item.qtd
      )
    ]);

    if(
      item.obsExtra &&
      item.obsExtra.trim()
    ){

      tabela.push([
        "",
        "Obs.: " +
        item.obsExtra.trim(),
        "",
        "",
        ""
      ]);

    }

  });


  doc.autoTable({

    startY:y,

    margin:{
      left:margem,
      right:margem
    },

    head:[[
      "CÓDIGO",
      "PRODUTO",
      "QTD.",
      "VALOR UNIT.",
      "TOTAL"
    ]],

    body:tabela,

    theme:"grid",

    styles:{
      font:"helvetica",
      fontSize:9,
      textColor:[40,40,40],
      lineColor:[220,213,205],
      lineWidth:0.25,
      cellPadding:3
    },

    headStyles:{
      fillColor:MARROM,
      textColor:[255,255,255],
      fontStyle:"bold",
      fontSize:8.5
    },

    alternateRowStyles:{
      fillColor:[250,248,245]
    },

    columnStyles:{

      0:{
        cellWidth:24,
        halign:"center"
      },

      1:{
        cellWidth:92
      },

      2:{
        cellWidth:18,
        halign:"center"
      },

      3:{
        cellWidth:28,
        halign:"right"
      },

      4:{
        cellWidth:28,
        halign:"right"
      }

    }

  });

  // ============================
  // TOTAL
  // ============================

  y =
    doc.lastAutoTable.finalY + 9;

  doc.setFillColor(...CREME);

  doc.roundedRect(
    105,
    y,
    95,
    14,
    2,
    2,
    "F"
  );

  doc.setTextColor(...MARROM_ESCURO);

  doc.setFont(
    "helvetica",
    "bold"
  );

  doc.setFontSize(10);

  doc.text(
    "TOTAL DO PEDIDO:",
    112,
    y + 8.5
  );

  doc.setFontSize(15);

  doc.text(
    formatarMoeda(pedido.total),
    196,
    y + 8.5,
    {
      align:"right"
    }
  );


  // ============================
  // INFORMAÇÕES ADICIONAIS
  // ============================

  y += 23;

  doc.setFillColor(...CREME);

  doc.roundedRect(
    margem,
    y,
    largura,
    8,
    1,
    1,
    "F"
  );

  doc.setTextColor(...MARROM_ESCURO);

  doc.setFont(
    "helvetica",
    "bold"
  );

  doc.setFontSize(11);

  doc.text(
    "INFORMAÇÕES ADICIONAIS",
    15,
    y + 5.5
  );

  y += 9;

  const texto =
    pedido.observacoes &&
    pedido.observacoes.trim()
      ? pedido.observacoes.trim()
      : "";

  const linhas =
    texto
      ? doc.splitTextToSize(
          texto,
          180
        )
      : [];

  const alturaObs =
    Math.max(
      22,
      9 + (linhas.length * 5)
    );

  doc.setDrawColor(...BORDA);
  doc.setLineWidth(0.3);

  doc.roundedRect(
    margem,
    y,
    largura,
    alturaObs,
    1,
    1,
    "S"
  );

  if(linhas.length){

    doc.setFont(
      "helvetica",
      "normal"
    );

    doc.setFontSize(9);

    doc.setTextColor(
      45,
      45,
      45
    );

    doc.text(
      linhas,
      15,
      y + 8
    );

  }


  // ============================
  // RODAPÉ MARROM
  // ============================

  const alturaRodape = 28;

  const rodapeY =
    297 - alturaRodape;

  doc.setFillColor(
    ...MARROM_ESCURO
  );

  doc.rect(
    0,
    rodapeY,
    210,
    alturaRodape,
    "F"
  );

  doc.setTextColor(
    255,
    255,
    255
  );

  doc.setFont(
    "times",
    "bold"
  );

  doc.setFontSize(13);

  doc.text(
    "VELAS TRÊS COLINAS",
    15,
    rodapeY + 10
  );

  doc.setFont(
    "helvetica",
    "normal"
  );

  doc.setFontSize(7.5);

  doc.text(
    "DESDE 2000",
    15,
    rodapeY + 17
  );

  doc.setFontSize(9);

  doc.text(
    "(16) 99108-4057",
    73,
    rodapeY + 12
  );

  doc.text(
    "@velastrescolinas",
    118,
    rodapeY + 12
  );

  doc.text(
    "Ituverava - SP",
    167,
    rodapeY + 12
  );

  doc.setDrawColor(
    255,
    255,
    255
  );

  doc.setLineWidth(0.25);

  doc.line(
    67,
    rodapeY + 5,
    67,
    rodapeY + 22
  );

  doc.line(
    112,
    rodapeY + 5,
    112,
    rodapeY + 22
  );

  doc.line(
    162,
    rodapeY + 5,
    162,
    rodapeY + 22
  );


  // ============================
  // SALVAR PDF
  // ============================

  doc.save(
    `Pedido_${pedido.numero}_${pedido.cliente
      .replace(/[^\w\s-]/g,"")
      .replace(/\s+/g,"_")
    }.pdf`
  );

}

async function enviarPedido() {
  try {
    const cliente = document.getElementById("cliente").value.trim();
    if(!cliente){alert("O campo Nome/Razão Social do Cliente é obrigatório!"); return;}
    const dataPedido = document.getElementById("data").value;
    if(!dataPedido){alert("O campo Data é obrigatório!"); return;}

    const docCampo = document.getElementById("doc").value;
    const vendedor = document.getElementById("vendedor").value;
    const cidade = document.getElementById("cidade").value;
    const pagamento = document.getElementById("pagamento").value;
    const observacoes = document.getElementById("observacoes").value;

    const itens = [];
    listaProdutos.forEach((p,i)=>{
      const qtd = Number(document.getElementById(`qtd_${i}`).value);
      if(qtd>0){
        const obsExtra = document.getElementById(`obs_${i}`) ? document.getElementById(`obs_${i}`).value : "";
        const preco = Number(document.getElementById(`preco_${i}`).value);

    itens.push({
      codigo:p.codigo,
      nome:p.nome,
      qtd,
      preco,
      obsExtra
    });
      }
    });

    if(itens.length===0){alert("Selecione pelo menos um produto."); return;}

    const pedido={cliente,doc:docCampo,vendedor,cidade,pagamento,data:dataPedido,observacoes,itens};

    gerarPDF(pedido);

    await fetch("https://script.google.com/macros/s/AKfycbwfkegXj_ZUuqTOE_lrC_E31-YNsQp6euznpBy02ab6unrcfheiu9_r78-9pM0YWncZ/exec",{
      method:"POST",
      mode:"no-cors",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(pedido)
    });

    alert("Pedido enviado e PDF gerado com sucesso!");
  }catch(erro){alert("Erro: "+erro);}
}

// Inicializa
renderProdutos();
preencherDataHoje();
</script>
</body>
</html>
